# ============================================================
#  Tinc Master Match File  |  tinc.yml
#  Project: https://github.com/utkarsh-brainstorm/tinc
# ============================================================
#
#  SYNTAX:  [your text here]command
#  No hyphens. Square brackets wrap the text, suffix follows directly.
#  All triggers INSTANTLY show ⏳ while AI processes in background.
#
#  ── AI ──────────────────────────────────────────────────────
#
#    [prompt]ai    Open interactive Spotlight AI chat window
#    [prompt]ad    Paste full AI answer directly
#    [prompt]ac    Paste ONLY a shell command (no prose)
#    [prompt]av    Use clipboard as context, prompt as instruction
#
#  ── WRITING ─────────────────────────────────────────────────
#    [text]fix     Fix spelling & minor grammar, preserve tone
#    [text]tldr    1-2 sentence TL;DR executive summary
#
#  ── CODE ────────────────────────────────────────────────────
#    [prompt]ref   Refactor + comment messy code
#    [prompt]py    Python code only
#    [prompt]cp    C++ code only
#    [prompt]sh    Bash script only
#    [prompt]htm   HTML only
#    [prompt]csv   CSV data only
#    [prompt]json  JSON data only
#
#  ── CLIPBOARD VARIANTS (suffix with 'v') ────────────────────
#    []fixv    Fix spelling/grammar of clipboard text
#    []tldrv   TL;DR of clipboard text
#    []refv    Refactor clipboard code
#    []pyv     Convert clipboard text to Python
#    []cpv     Convert clipboard text to C++
#    []shv     Convert clipboard text to Bash
#    []htmv    Convert clipboard text to HTML
#    []csvv    Convert clipboard text to CSV
#    []jsonv   Convert clipboard text to JSON
#    []acv     Shell command from clipboard context
#    []adv     (same as av) Answer from clipboard context
#    Note: all [v] triggers also work with an instruction:
#          [make it formal]fixv  or  []fixv  ← both fine
#
#  ── TRANSLATION ─────────────────────────────────────────────
#    [text]hi    Full Hindi translation (grammar + vocab)
#    [text]hd    Literal transliteration (Romanized → Devanagari)
#    [text]hu    Hinglish → Hindi script
#
#  ── MISC ────────────────────────────────────────────────────
#    :today  → 2026-01-15
#    :time   → 14:30:00
#    :myip   → your public IP
#
# ============================================================

matches:
  # ─────────────────────────────────────────────────────────
  # MISC
  # ─────────────────────────────────────────────────────────

  - trigger: ":today"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":time"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%H:%M:%S"

  - trigger: ":myip"
    replace: "{{ip}}"
    vars:
      - name: ip
        type: shell
        params:
          cmd: "curl -s ifconfig.me"

  # ═══════════════════════════════════════════════════════════
  #  TRANSLATION  ─  [text]hi / [text]hd / [text]hu
  # ═══════════════════════════════════════════════════════════

  - regex: "\\[(?P<text>[^\\]]+)\\]hi$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hi ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  - regex: "\\[(?P<text>[^\\]]+)\\]hd$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hd ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  - regex: "\\[(?P<text>[^\\]]+)\\]hu$"
    replace: "{{out}}"
