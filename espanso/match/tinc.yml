# ============================================================
#  Tinc Master Match File  |  tinc.yml
#  Project: https://github.com/utkarsh-brainstorm/tinc
# ============================================================
#
#  SYNTAX:  [your text here]command
#  All async triggers instantly place "Bas ittu sa time aur..."
#
#  ── AI CORE ─────────────────────────────────────────────────
#    [prompt]ai    Direct answer, zero system prompt
#    [prompt]av    ai + clipboard as context  (i→v)
#    [prompt]ad    Short, precise answer (1-2 lines max)
#
#  ── WRITING ─────────────────────────────────────────────────
#    [text]fix     Fix spelling/grammar, preserve tone exactly
#    [text]tldr    1-2 sentence TL;DR
#
#  ── CODE ────────────────────────────────────────────────────
#    [prompt]ref   Refactor + comment
#    [prompt]py    Python only
#    [prompt]cp    C++ only
#    [prompt]sh    Bash only
#    [prompt]htm   HTML only
#    [prompt]csv   CSV only
#    [prompt]json  JSON only
#
#  ── CLIPBOARD VARIANTS (replace last char with 'v') ─────────
#    []fiv    Fix clipboard text
#    []tldv   TL;DR clipboard text
#    []rev    Refactor clipboard code
#    []pv     Clipboard → Python
#    []cv     Clipboard → C++
#    []sv     Clipboard → Bash
#    []htv    Clipboard → HTML
#    []jsov   Clipboard → JSON
#    []csj    Clipboard → CSV
#    []av     Clipboard as context for ai answer
#
#  ── TRANSLATION ─────────────────────────────────────────────
#    [text]hi    Hindi translation
#    [text]hd    Romanized → Devanagari
#    [text]hu    Hinglish → Hindi
#
#  ── MISC ────────────────────────────────────────────────────
#    :today  :time  :myip
#
# ============================================================

matches:
  # ─────────────────────────────────────────────────────────
  # MISC
  # ─────────────────────────────────────────────────────────

  - trigger: ":today"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":time"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%H:%M:%S"

  - trigger: ":myip"
    replace: "{{ip}}"
    vars:
      - name: ip
        type: shell
        params:
          cmd: "curl -s ifconfig.me"

  # ═══════════════════════════════════════════════════════════
  #  TRANSLATION
  # ═══════════════════════════════════════════════════════════

  - regex: "\\[(?P<text>[^\\]]+)\\]hi$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hi ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  - regex: "\\[(?P<text>[^\\]]+)\\]hd$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hd ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  - regex: "\\[(?P<text>[^\\]]+)\\]hu$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hu ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  # ═══════════════════════════════════════════════════════════
  #  AI CORE
  # ═══════════════════════════════════════════════════════════

  # ai — direct answer, no system prompt
  - regex: "\\[(?P<prompt>[^\\]]*)\\]ai$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=ai ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # av — ai + clipboard context  (i→v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]av$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=av ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # ad — short, precise answer (1-2 lines)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]ad$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=ad ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # ═══════════════════════════════════════════════════════════
  #  WRITING
