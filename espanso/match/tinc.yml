  # jsov = json with clipboard (json → jso + v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]jsov$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=jsov ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # csj  = csv with clipboard  (csv ends in v already, use csj as variant)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]csj$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=csj ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"
