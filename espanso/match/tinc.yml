# ============================================================
#  Tinc Master Match File  |  tinc.yml
#  Project: https://github.com/utkarsh-brainstorm/tinc
# ============================================================
#
#  SYNTAX:  [your text here]command
#  Square brackets wrap the prompt/text, suffix follows directly.
#  All triggers INSTANTLY show "Bas ittu sa time aur..." while processing.
#
#  ── AI CORE ─────────────────────────────────────────────────
#    [prompt]ai    Open interactive Spotlight AI chat window
#    [prompt]ad    AI answer typed directly into active window
#    [prompt]ac    Shell command only, typed directly
#    [prompt]av    Clipboard text as context, prompt as instruction
#
#  ── WRITING ─────────────────────────────────────────────────
#    [text]fix     Fix spelling & minor grammar, preserve tone
#    [text]tldr    1-2 sentence TL;DR summary
#
#  ── CODE (output typed directly, no clipboard) ──────────────
#    [prompt]ref   Refactor + comment code
#    [prompt]py    Python code only
#    [prompt]cp    C++ code only
#    [prompt]sh    Bash script only
#    [prompt]htm   HTML only
#    [prompt]csv   CSV data only
#    [prompt]json  JSON data only
#
#  ── CLIPBOARD VARIANTS ──────────────────────────────────────
#  Replace the LAST character of any suffix with 'v'.
#  Works with empty brackets (instruction already implied).
#  Also works with an optional instruction: [make formal]fiv
#
#    []fiv    Fix clipboard text spelling/grammar
#    []tldv   TL;DR of clipboard text
#    []rev    Refactor clipboard code
#    []pv     Convert clipboard text to Python
#    []cv     Convert clipboard text to C++
#    []sv     Convert clipboard text to Bash
#    []htv    Convert clipboard text to HTML
#    []jsov   Convert clipboard text to JSON
#    []csj    Convert clipboard text to CSV
#
#    [prompt]av  is already the clipboard variant of ad
#    [prompt]av  can also carry an optional instruction
#
#  ── TRANSLATION ─────────────────────────────────────────────
#    [text]hi    Full Hindi translation
#    [text]hd    Romanized → Devanagari transliteration
#    [text]hu    Hinglish → Hindi script
#
#  ── MISC ────────────────────────────────────────────────────
#    :today  → current date
#    :time   → current time
#    :myip   → your public IP
#
# ============================================================

matches:
  # ─────────────────────────────────────────────────────────
  # MISC
  # ─────────────────────────────────────────────────────────

  - trigger: ":today"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":time"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%H:%M:%S"

  - trigger: ":myip"
    replace: "{{ip}}"
    vars:
      - name: ip
        type: shell
        params:
          cmd: "curl -s ifconfig.me"

  # ═══════════════════════════════════════════════════════════
  #  TRANSLATION  ─  [text]hi / [text]hd / [text]hu
  # ═══════════════════════════════════════════════════════════

  - regex: "\\[(?P<text>[^\\]]+)\\]hi$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hi ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  - regex: "\\[(?P<text>[^\\]]+)\\]hd$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hd ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  - regex: "\\[(?P<text>[^\\]]+)\\]hu$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=hu ESPANSO_TEXT='{{text}}' python3 ~/.config/espanso/scripts/translate_client.py"

  # ═══════════════════════════════════════════════════════════
  #  AI CORE
  # ═══════════════════════════════════════════════════════════

  - regex: "\\[(?P<prompt>[^\\]]*)\\]ai$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=ai ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]ad$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=ad ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]ac$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=ac ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # av = ad with clipboard as context (last char d→v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]av$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=av ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # ═══════════════════════════════════════════════════════════
  #  WRITING
  # ═══════════════════════════════════════════════════════════

  - regex: "\\[(?P<prompt>[^\\]]+)\\]fix$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=fix ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]+)\\]tldr$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=tldr ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # ═══════════════════════════════════════════════════════════
  #  CODE OUTPUT
  # ═══════════════════════════════════════════════════════════

  - regex: "\\[(?P<prompt>[^\\]]+)\\]ref$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=ref ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]py$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=py ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]cp$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=cp ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]sh$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=sh ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]htm$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=htm ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]csv$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=csv ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  - regex: "\\[(?P<prompt>[^\\]]*)\\]json$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=json ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # ═══════════════════════════════════════════════════════════
  #  CLIPBOARD VARIANTS
  #  Replace LAST CHAR of suffix with 'v' to use clipboard as input.
  #  Empty brackets OK: []fiv  or  [extra instruction]fiv
  # ═══════════════════════════════════════════════════════════

  # fiv  = fix with clipboard  (fix → fi + v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]fiv$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=fiv ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # tldv = tldr with clipboard (tldr → tld + v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]tldv$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=tldv ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # rev  = ref with clipboard  (ref → re + v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]rev$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=rev ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # pv   = py with clipboard   (py → p + v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]pv$"
    replace: "{{out}}"
    vars:
      - name: out
