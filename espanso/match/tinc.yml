  # sv   = sh with clipboard   (sh → s + v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]sv$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "ESPANSO_MODE=sv ESPANSO_TEXT='{{prompt}}' python3 ~/.config/espanso/scripts/ai_router.py"

  # htv  = htm with clipboard  (htm → ht + v)
  - regex: "\\[(?P<prompt>[^\\]]*)\\]htv$"
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
