# ============================================================
#  Espanso Default Config  |  default.yml
#  Author: Utkarsh Yadav
# ============================================================

# Backend: Use X11 backend (via XWayland).
# WHY X11 NOT WAYLAND:
# Espanso's Wayland backend uses the xdg-desktop-portal RemoteDesktop/EIS protocol
# to inject keystrokes. GNOME shows a security permission popup every session
# ("Allow remote interaction") with an intimidating top-bar notification icon.
# There is no stable way to permanently auto-allow this for non-flatpak apps.
# Switching to the X11 backend uses XWayland's XTest extension instead,
# which requires zero portals, zero popups, and zero permission dialogs.
# XWayland is always running alongside Wayland on Ubuntu GNOME desktops.
backend: "xdotool"

# Keyboard layout
keyboard_layout:
  layout: "us"
  variant: ""

# Use clipboard injection for atomic, instant text replacement.
# CRITICAL: Without this, Espanso types char-by-char (breaks on slow scripts).
force_clipboard: true

# Do NOT restore clipboard after injection — keep translated/AI text in clipboard
# so user can paste it elsewhere if needed.
restore_clipboard: false

# ── CRITICAL: Increase the regex buffer size ──────────────────────────────────
# Default is 30 chars. This means Espanso only looks at the last 30 characters
# for pattern matching. Long sentences in [long text here]hi would fail silently.
# We set this high to support long sentence translations and AI prompts.
max_regex_buffer_size: 10000


# ── Word separators ──────────────────────────────────────────────────────────
# IMPORTANT: Do NOT include [ or ] here.
# If '[' is a word separator, Espanso resets its capture buffer when the user
# types '[', which completely breaks [text]hi / [text]ai triggers.
# Only keep separators that genuinely bound a word.
word_separators:
  - "\n"
  - "\r"
  - "\t"
