# ============================================================
#  Espanso Default Config  |  default.yml
#  Project: This is Not Copilot (tinc)
# ============================================================

# Backend: Auto (EVDEV on Linux).
# Espanso detects keypresses via /dev/input (kernel-level, no portal).
# Text injection via /dev/uinput (kernel-level, no portal).
# This is the most reliable backend on Linux — zero popups, zero portals.
backend: "auto"

# Keyboard layout
keyboard_layout:
  layout: "us"
  variant: ""

# Clipboard injection for Espanso's OWN trigger replacement.
# Required: prevents Espanso typing char-by-char (which breaks regex triggers).
force_clipboard: true

# Keep AI/translated output in clipboard after pasting (useful to re-paste).
restore_clipboard: false

# Regex buffer: must be large enough for longest [prompt]ai trigger.
# Default 30 chars would silently break long prompts.
max_regex_buffer_size: 10000

# Word separators: do NOT include [ or ] — they are used in our trigger syntax.
# Including them would reset Espanso's capture buffer mid-trigger.
word_separators:
  - "\n"
  - "\r"
  - "\t"
